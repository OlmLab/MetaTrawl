[project]
name = "metatrawl"
version = "0.2.4"
description = "Mutable registry and workflow bookkeeping for large ZipStrain/SRA profiling projects."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "duckdb>=1.1",
    "h5py>=3.10",
    "matplotlib>=3.10",
    "numpy>=1.26",
    "polars>=1.0",
    "rich>=13.0",
    "scipy>=1.16",
    "seaborn>=0.13",
    "zipstrain>=1.0.1,<2",
    "zstandard>=0.23",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
metatrawl = "metatrawl.cli:cli"

[tool.poetry]
packages = [{include = "metatrawl", from = "src"}]
include = [{path = "src/metatrawl/web", format = ["sdist", "wheel"]}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
