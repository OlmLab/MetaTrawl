name: metatrawl-v2
channels:
  - conda-forge
  - bioconda
dependencies:
  - python >=3.12
  # The external executables MetaTrawl shells out to
  - sylph
  - samtools
  - bowtie2
  - prodigal
  - sra-tools
  - ncbi-datasets-cli
  # MetaTrawl's own Python dependencies (resolved by conda, not pip)
  - click >=8.1
  - duckdb >=1.1
  - polars >=1.36.1,<3
  - rich >=13.0
  - pip
  - pip:
      # ZipStrain 2 and its Rust profiler come from PyPI until their Bioconda
      # recipes are published; metatrawl pulls in both.
      - metatrawl==2.1.0
