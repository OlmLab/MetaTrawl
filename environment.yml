name: metatrawl-v2
channels:
  - conda-forge
  - bioconda
dependencies:
  - python >=3.12
  # ZipStrain profiler + the external executables MetaTrawl shells out to
  - zipstrain >=2.0.0,<3
  - sylph
  - samtools
  - bowtie2
  - prodigal
  - sra-tools
  - ncbi-datasets-cli
  # MetaTrawl's own Python dependencies (resolved by conda, not pip)
  - click >=8.1
  - duckdb >=1.1
  - polars >=1.36.1,<3
  - rich >=13.0
  - pip
  - pip:
      # Requires the ZipStrain 2.x Bioconda recipe to be available.
      - metatrawl==2.0.1
